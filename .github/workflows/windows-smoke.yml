name: Windows navigation smoke
# validates current navigation/dashboard safety stack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python pytest PyYAML brian2==2.10.1
      - name: Compile Python sources
        run: python -m compileall -q lab brain/scripts tests
      - name: Neural interface and navigation unit tests
        run: >-
          python -m pytest -q
          tests/test_live_d8_interface.py
          tests/test_live_intent_decoder.py
          tests/test_navigation_mapping.py
          tests/test_windows_navigation_backend.py
          tests/test_brian_count_monitor.py
      - name: Synthetic full-pipeline smoke
        run: python -m lab.app --self-test
