name: Windows navigation smoke
# validates current navigation/dashboard safety stack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python pytest PyYAML brian2==2.10.1
      - name: Compile Python sources
        run: python -m compileall -q lab brain/scripts tests
      - name: Parse PowerShell launchers
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\run_autonomous_navigation_windows.ps1",
            [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\run_autonomous_questing_windows.ps1",
            [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\setup_semantic_coach_windows.ps1",
            [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
      - name: Neural interface and navigation unit tests
        run: >-
          python -m pytest -q
          tests/test_live_d8_interface.py
          tests/test_live_intent_decoder.py
          tests/test_navigation_mapping.py
          tests/test_windows_navigation_backend.py
          tests/test_brian_count_monitor.py
          tests/test_dashboard_quest_pve.py
          tests/test_dashboard_quest_mode.py
          tests/test_gpo_action_surface.py
          tests/test_quest_pve.py
          tests/test_gpo_controls.py
          tests/test_semantic_coach.py
      - name: Synthetic full-pipeline smoke
        run: python -m lab.app --self-test
